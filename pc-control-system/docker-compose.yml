version: '3.8'

services:
  pc-control-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pc-control-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pc-control-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_PATH=/data
      - API_KEY=${API_KEY:-}
      # URL WebSocket para o zip de download do cliente
      - CLIENT_WS_URL=${CLIENT_WS_URL:-ws://192.168.0.200:3000}
      # Mapa de MACs → portas mgmt dos bridges (JSON)
      # Formato: [{"mac":"AA:BB:CC:DD:EE:FF","mgmtPort":5541},...]
      - MATTER_BRIDGES=${MATTER_BRIDGES:-[]}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pc-control-network

  # Bridge do Marcus — porta Matter 5540, mgmt 5541
  matter-bridge-marcus:
    build:
      context: ./matter-bridge
      dockerfile: Dockerfile
    container_name: pc-matter-bridge-marcus
    restart: unless-stopped
    network_mode: host
    depends_on:
      - pc-control-server
    environment:
      - SERVER_URL=http://localhost:3000
      - DEFAULT_MAC=${PC_MAC_MARCUS:-}
      - BRIDGE_PORT=5540
      - BRIDGE_ID=bridge-marcus
      - MGMT_PORT=5541
    volumes:
      - matter-bridge-marcus:/data

  # Bridge do Pai — porta Matter 5542, mgmt 5543
  matter-bridge-pai:
    build:
      context: ./matter-bridge
      dockerfile: Dockerfile
    container_name: pc-matter-bridge-pai
    restart: unless-stopped
    network_mode: host
    depends_on:
      - pc-control-server
    environment:
      - SERVER_URL=http://localhost:3000
      - DEFAULT_MAC=${PC_MAC_PAI:-}
      - BRIDGE_PORT=5542
      - BRIDGE_ID=bridge-pai
      - MGMT_PORT=5543
    volumes:
      - matter-bridge-pai:/data

volumes:
  pc-control-data:
  matter-bridge-marcus:
  matter-bridge-pai:

networks:
  pc-control-network:
    driver: bridge
