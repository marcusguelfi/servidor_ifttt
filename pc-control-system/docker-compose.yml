version: '3.8'

services:
  pc-control-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pc-control-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pc-control-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_PATH=/data
      - API_KEY=${API_KEY:-}
      # URL WebSocket que os clientes usam para conectar (incluída no zip de download)
      - CLIENT_WS_URL=${CLIENT_WS_URL:-ws://192.168.0.225:3000}
      # Porta do management HTTP da matter-bridge (deve bater com MGMT_PORT abaixo)
      - MATTER_MGMT_PORT=5541
    networks:
      - pc-control-network

  matter-bridge:
    build:
      context: ./matter-bridge
      dockerfile: Dockerfile
    container_name: pc-matter-bridge
    restart: unless-stopped
    # network_mode: host é obrigatório para Matter (mDNS UDP 5353 + Matter TCP/UDP 5540)
    network_mode: host
    depends_on:
      - pc-control-server
    environment:
      - SERVER_URL=http://localhost:3000
      # MAC address do PC principal dono desta bridge
      # Obtenha no web UI após conectar o cliente, ou via: python -c "import uuid; print(':'.join(['{:02x}'.format((uuid.getnode()>>e)&0xff) for e in range(0,12,2)][::-1]))"
      - DEFAULT_MAC=${PC_DEFAULT_MAC:-}
      - MGMT_PORT=5541
    volumes:
      - matter-bridge-data:/data

volumes:
  pc-control-data:
  matter-bridge-data:

networks:
  pc-control-network:
    driver: bridge
